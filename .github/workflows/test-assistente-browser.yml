name: Test assistant in browsers

on:
  workflow_dispatch:
  push:
    paths:
      - "assistente/*.js"
      - "assistente/index.html"
      - "assistente/style.css"
      - "tests-browser/**"
      - "playwright.config.js"
      - "package.json"
      - ".github/workflows/test-assistente-browser.yml"

permissions:
  contents: write

concurrency:
  group: assistant-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        id: dependencies
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        id: chromium
        continue-on-error: true
        if: steps.dependencies.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop tests
        id: browser_tests
        continue-on-error: true
        if: steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log
      - name: Record browser-tested version
        if: always()
        run: |
          STATUS="passed"
          if [ "${{ steps.dependencies.outcome }}" != "success" ] || [ "${{ steps.chromium.outcome }}" != "success" ] || [ "${{ steps.browser_tests.outcome }}" != "success" ]; then
            STATUS="failed"
          fi
          printf '{"status":"%s","commit":"%s","tested_at":"%s","dependencies":"%s","chromium":"%s","browser_tests":"%s","projects":["mobile-chromium","desktop-chromium"]}\n' "$STATUS" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ steps.dependencies.outcome }}" "${{ steps.chromium.outcome }}" "${{ steps.browser_tests.outcome }}" > assistente/browser-test-status.json
          if [ -f browser-test.log ]; then
            tail -n 180 browser-test.log > assistente/browser-test-log.txt
          else
            printf 'O teste de navegador não chegou a gerar um relatório.\n' > assistente/browser-test-log.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistente/browser-test-status.json assistente/browser-test-log.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record assistant browser test result"
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
              sleep $((attempt * 3))
            done
          fi
          if [ "$STATUS" != "passed" ]; then
            exit 1
          fi
