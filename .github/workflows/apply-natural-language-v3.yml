name: Apply natural language V3

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/patch_natural_language_v3.py"
      - ".github/workflows/apply-natural-language-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply classifier patch
        run: python scripts/patch_natural_language_v3.py

      - name: Validate JavaScript
        run: node --check assistente/app.js

      - name: Validate critical phrases
        run: |
          grep -q 'gostaria de uma aliança de casamento' assistente/app.js
          grep -q 'NATURAL_LANGUAGE_V3' assistente/app.js
          grep -q 'app.js?v=natural-v3' assistente/index.html

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistente/app.js assistente/index.html
          git commit -m "Improve natural language recognition [skip patch]"
          git push
